<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>传统滋补 H2 战略屋 · 横版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#ECEFF3;min-height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color:#16283C;-webkit-font-smoothing:antialiased;padding:40px 32px 56px;
}
.stage{
  max-width:1520px;margin:0 auto;
  background:radial-gradient(120% 80% at 50% -12%,#F3F8FD 0%,#FFFFFF 46%,#FDFEFF 100%);
  border:1px solid #E1E7EF;border-radius:28px;padding:44px 48px 52px;
  box-shadow:0 26px 68px rgba(20,45,80,.10),inset 0 1px 0 #FFFFFF;
}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:32px;flex-wrap:wrap;
  padding-bottom:26px;margin-bottom:34px;border-bottom:1px solid #E1E7EF}
.head .eyebrow{font-size:11px;letter-spacing:.24em;color:#1D7FC0;font-weight:700;margin-bottom:12px}
.head h1{font-size:33px;font-weight:700;letter-spacing:-.02em;line-height:1.2;color:#0E2B4D}
.head .sub{margin-top:10px;font-size:13.5px;color:#6D7D8E}
.head .read{font-size:12.5px;color:#4A5C6E;line-height:2;max-width:404px;
  background:#F5F8FC;border:1px solid #DFE7F1;border-radius:14px;padding:14px 18px}
.head .read b{color:#0E2B4D;font-weight:700}
.head .read span{color:#1D7FC0;font-weight:700}
svg{width:100%;height:auto;display:block}
svg text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.legend{display:flex;flex-wrap:wrap;gap:26px;margin-top:30px;padding-top:24px;
  border-top:1px solid #E1E7EF;font-size:12px;color:#6D7D8E}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:22px;height:8px;border-radius:4px;display:inline-block}
.foot{margin-top:22px;font-size:11.5px;color:#93A1B0;line-height:1.85}
@media(max-width:900px){body{padding:20px 12px 32px}.stage{padding:26px 20px 32px;border-radius:20px}.head h1{font-size:24px}}
</style>
</head>
<body>
<div class="stage">

  <div class="head">
    <div>
      <div class="eyebrow">8.24 进京前更新版</div>
      <h1>传统滋补赛道 H2 战略屋</h1>
      <div class="sub">汇报：总经理　·　讲述：大发 / 白爽 / 宗欣</div>
    </div>
    <div class="read">
      <b>推导链（沿箭头自下而上）</b><br>
      <span>三个诊断</span> 看清了什么　→　<span>双基石</span> 前提是什么　→　<span>三支柱</span> 投哪三个方向　→　<span>屋顶</span> 交付什么结果<br>
      三列上下同一条逻辑，可整列纵读。
    </div>
  </div>

  <svg viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="roof" x1="0.15" y1="0" x2="0.8" y2="1">
        <stop offset="0" stop-color="#2A6BAE"/>
        <stop offset="0.45" stop-color="#1B4B85"/>
        <stop offset="1" stop-color="#123762"/>
      </linearGradient>
      <radialGradient id="roofGlow" cx="0.5" cy="0.16" r="0.62">
        <stop offset="0" stop-color="#9FD0F5" stop-opacity="0.34"/>
        <stop offset="0.45" stop-color="#7FB8E8" stop-opacity="0.12"/>
        <stop offset="1" stop-color="#7FB8E8" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="eave" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#123762"/>
        <stop offset="0.3" stop-color="#2F6DAE"/>
        <stop offset="0.5" stop-color="#4A8FCE"/>
        <stop offset="0.7" stop-color="#2F6DAE"/>
        <stop offset="1" stop-color="#123762"/>
      </linearGradient>
      <linearGradient id="pillarHead" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#F0F5FB"/>
        <stop offset="1" stop-color="#E7EEF7"/>
      </linearGradient>
      <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#EAF2FB"/>
        <stop offset="1" stop-color="#E0EAF6"/>
      </linearGradient>
      <clipPath id="roofClip">
        <polygon points="720,38 1384,232 56,232"/>
      </clipPath>
      <g id="chev">
        <polyline points="-4.5,6 0,0 4.5,6" fill="none" stroke="#6E9BC4" stroke-opacity="0.8"
                  stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </defs>

    <!-- ══════════ 屋顶 · 北极星 ══════════ -->
    <polygon points="720,38 1384,232 56,232"
             fill="url(#roof)" stroke="url(#roof)" stroke-width="22" stroke-linejoin="round"/>
    <g clip-path="url(#roofClip)">
      <ellipse cx="720" cy="86" rx="560" ry="210" fill="url(#roofGlow)"/>
    </g>
    <polygon points="720,38 1384,232 56,232" fill="none"
             stroke="#FFFFFF" stroke-opacity="0.20" stroke-width="1.4" stroke-linejoin="round"/>
    <polygon points="720,74 1338,222 102,222" fill="none"
             stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1" stroke-linejoin="round"/>

    <text x="720" y="128" font-size="11.5" letter-spacing="5" fill="#BEDCF5" text-anchor="middle" font-weight="700">H2 北极星</text>
    <text x="720" y="176" font-size="36" font-weight="700" letter-spacing="-0.6" fill="#FFFFFF" text-anchor="middle">把量长在方法论上</text>
    <text x="720" y="210" font-size="15" fill="#CFE3F5" text-anchor="middle">存量更强　·　新开更准　·　节点更爆，谷底不低</text>

    <rect x="38" y="226" width="1364" height="15" rx="7.5" fill="url(#eave)"/>

    <!-- 箭头 · 三支柱 → 屋顶 -->
    <line x1="268" y1="282" x2="268" y2="260" stroke="#6E9BC4" stroke-opacity="0.8" stroke-width="1.5" stroke-linecap="round"/>
    <use href="#chev" x="268" y="252"/>
    <line x1="720" y1="282" x2="720" y2="260" stroke="#6E9BC4" stroke-opacity="0.8" stroke-width="1.5" stroke-linecap="round"/>
    <use href="#chev" x="720" y="252"/>
    <line x1="1172" y1="282" x2="1172" y2="260" stroke="#6E9BC4" stroke-opacity="0.8" stroke-width="1.5" stroke-linecap="round"/>
    <use href="#chev" x="1172" y="252"/>

    <!-- ══════════ 三支柱 ══════════ -->

    <!-- 柱一 · 客群 -->
    <rect x="56" y="286" width="424" height="344" rx="18" fill="#FFFFFF" stroke="#DCE4EE"/>
    <rect x="56" y="286" width="424" height="62" rx="18" fill="url(#pillarHead)"/>
    <rect x="57" y="332" width="422" height="16" fill="#E7EEF7"/>
    <line x1="56" y1="348" x2="480" y2="348" stroke="#DCE4EE"/>
    <text x="78" y="314" font-size="10.5" letter-spacing="4" fill="#1D7FC0" font-weight="700">支柱一</text>
    <text x="78" y="336" font-size="17.5" font-weight="700" fill="#0E2B4D">客群　五类分层</text>

    <text x="78" y="378" font-size="11.5" fill="#8A98A6">每类一条短期主线，一条长期主线</text>

    <text x="78" y="410" font-size="13.5" font-weight="700" fill="#12304F">经销商</text>
    <text x="182" y="410" font-size="12.5" fill="#5A6C7E">跑品 / 全域 SOP</text>
    <text x="78" y="438" font-size="13.5" font-weight="700" fill="#12304F">人设型</text>
    <text x="182" y="438" font-size="12.5" fill="#5A6C7E">人设突围 / 内容工业化</text>
    <text x="78" y="466" font-size="13.5" font-weight="700" fill="#12304F">白牌贸易</text>
    <text x="182" y="466" font-size="12.5" fill="#5A6C7E">做减法</text>
    <text x="78" y="494" font-size="13.5" font-weight="700" fill="#12304F">新锐商家</text>
    <text x="182" y="494" font-size="12.5" fill="#5A6C7E">冷启动 / 生意陪跑</text>
    <text x="78" y="522" font-size="13.5" font-weight="700" fill="#12304F">传统品牌</text>
    <text x="182" y="522" font-size="12.5" fill="#5A6C7E">节点 ＋ 四力主力</text>

    <line x1="78" y1="548" x2="458" y2="548" stroke="#E5EBF3"/>
    <text x="78" y="572" font-size="10.5" letter-spacing="3" fill="#8A98A6" font-weight="700">当前盘子</text>
    <text x="78" y="596" font-size="12.5" fill="#4A5C6E">贸易商 <tspan font-weight="700" fill="#12304F">135 万 · 69.7%</tspan>　同比 <tspan fill="#1D7FC0" font-weight="700">+32%</tspan></text>
    <text x="78" y="618" font-size="12.5" fill="#4A5C6E">新锐 <tspan font-weight="700" fill="#12304F">45 万 · 23.4%</tspan>　量级持平，信任等级升级</text>

    <!-- 柱二 · 品类 -->
    <rect x="508" y="286" width="424" height="344" rx="18" fill="#FFFFFF" stroke="#DCE4EE"/>
    <rect x="508" y="286" width="424" height="62" rx="18" fill="url(#pillarHead)"/>
    <rect x="509" y="332" width="422" height="16" fill="#E7EEF7"/>
    <line x1="508" y1="348" x2="932" y2="348" stroke="#DCE4EE"/>
    <text x="530" y="314" font-size="10.5" letter-spacing="4" fill="#1D7FC0" font-weight="700">支柱二</text>
    <text x="530" y="336" font-size="17.5" font-weight="700" fill="#0E2B4D">品类　三层判断</text>

    <text x="530" y="378" font-size="11.5" fill="#8A98A6">从经验判断升级为有法可依，逐级收敛到清单</text>

    <text x="530" y="410" font-size="13.5" font-weight="700" fill="#12304F">看差距</text>
    <text x="530" y="430" font-size="12.5" fill="#5A6C7E">29 成分做腾讯 vs 抖音倍数差　<tspan fill="#1D7FC0" font-weight="700">蛹虫草 1312x · 黄芪 123x</tspan></text>

    <text x="530" y="460" font-size="13.5" font-weight="700" fill="#12304F">看自身</text>
    <text x="530" y="480" font-size="12.5" fill="#5A6C7E">三维筛选　<tspan fill="#1D7FC0" font-weight="700">客单 ≥199 元 · 毛利 ≥75%</tspan> · 精准客群</text>

    <text x="530" y="510" font-size="13.5" font-weight="700" fill="#12304F">定优先级</text>
    <text x="530" y="530" font-size="12.5" fill="#5A6C7E">四维打分排 P0–P4　<tspan fill="#1D7FC0" font-weight="700">灵芝 阿胶 西洋参 先行</tspan></text>

    <line x1="530" y1="552" x2="910" y2="552" stroke="#E5EBF3"/>
    <text x="530" y="576" font-size="10.5" letter-spacing="3" fill="#8A98A6" font-weight="700">体质四象限</text>
    <text x="530" y="600" font-size="12.5" fill="#4A5C6E"><tspan fill="#1D7FC0" font-weight="700">守</tspan> 平和·湿热·血瘀　<tspan fill="#4E8DC0" font-weight="700">拓</tspan> 阳虚　<tspan font-weight="700" fill="#4A5C6E">追</tspan> 阴虚　<tspan fill="#B4761F" font-weight="700">绕</tspan> 气虚</text>
    <text x="530" y="620" font-size="11.5" fill="#7C8B9C">湿热质抖音为 0 是独占赛道；气虚差 52 倍不正面打</text>

    <!-- 柱三 · 能力 -->
    <rect x="960" y="286" width="424" height="344" rx="18" fill="#FFFFFF" stroke="#DCE4EE"/>
    <rect x="960" y="286" width="424" height="62" rx="18" fill="url(#pillarHead)"/>
    <rect x="961" y="332" width="422" height="16" fill="#E7EEF7"/>
    <line x1="960" y1="348" x2="1384" y2="348" stroke="#DCE4EE"/>
    <text x="982" y="314" font-size="10.5" letter-spacing="4" fill="#1D7FC0" font-weight="700">支柱三</text>
    <text x="982" y="336" font-size="17.5" font-weight="700" fill="#0E2B4D">能力　三条护城河</text>

    <text x="982" y="378" font-size="11.5" fill="#8A98A6">通用四力之上，长出滋补行业专属能力</text>

    <text x="982" y="410" font-size="13.5" font-weight="700" fill="#12304F">功效专项</text>
    <text x="982" y="430" font-size="12.5" fill="#5A6C7E">27 个合规功效范围　<tspan fill="#1D7FC0" font-weight="700">CPV 8 月底 · AI 预审 9 月</tspan></text>

    <text x="982" y="460" font-size="13.5" font-weight="700" fill="#12304F">信任力专项</text>
    <text x="982" y="480" font-size="12.5" fill="#5A6C7E">三农人设 1.0 → <tspan fill="#1D7FC0" font-weight="700">信任力 2.0</tspan>，五层链路</text>

    <text x="982" y="510" font-size="13.5" font-weight="700" fill="#12304F">公私域闭环专项</text>
    <text x="982" y="530" font-size="12.5" fill="#5A6C7E">公转私控风险 · 私转公撬预算　<tspan fill="#1D7FC0" font-weight="700">Q3 完成</tspan></text>

    <line x1="982" y1="552" x2="1362" y2="552" stroke="#E5EBF3"/>
    <text x="982" y="576" font-size="10.5" letter-spacing="3" fill="#8A98A6" font-weight="700">加粉引流三条新链路</text>
    <text x="982" y="600" font-size="12.5" fill="#4A5C6E">小程序直购　·　小店融合　·　小程序加粉</text>
    <text x="982" y="620" font-size="11.5" fill="#7C8B9C">企微闭环收口，把风险链路迁到可控通道</text>

    <!-- 箭头 · 双基石 → 三支柱 -->
    <line x1="268" y1="650" x2="268" y2="639" stroke="#6E9BC4" stroke-opacity="0.8" stroke-width="1.5" stroke-linecap="round"/>
    <use href="#chev" x="268" y="632"/>
    <line x1="720" y1="650" x2="720" y2="639" stroke="#6E9BC4" stroke-opacity="0.8" stroke-width="1.5" stroke-linecap="round"/>
    <use href="#chev" x="720" y="632"/>
    <line x1="1172" y1="650" x2="1172" y2="639" stroke="#6E9BC4" stroke-opacity="0.8" stroke-width="1.5" stroke-linecap="round"/>
    <use href="#chev" x="1172" y="632"/>

    <!-- ══════════ 双基石 ══════════ -->
    <rect x="56" y="654" width="1328" height="92" rx="18" fill="#F2F7FC"/>
    <rect x="56" y="654" width="650" height="92" rx="18" fill="url(#stone)" stroke="#B4CFEA"/>
    <rect x="56" y="678" width="4" height="44" rx="2" fill="#1D6FB8"/>
    <text x="80" y="682" font-size="10.5" letter-spacing="4" fill="#1D7FC0" font-weight="700">基石一</text>
    <text x="80" y="708" font-size="17" font-weight="700" fill="#0E2B4D">九种体质人群国标　GB/T 46939—2025</text>
    <text x="80" y="732" font-size="12" fill="#4A6480">2026-04-01 实施　|　<tspan fill="#1D6FB8" font-weight="700">让"品类适配 × 功效匹配"第一次有依据</tspan></text>

    <rect x="734" y="654" width="650" height="92" rx="18" fill="url(#stone)" stroke="#B4CFEA"/>
    <rect x="734" y="678" width="4" height="44" rx="2" fill="#1D6FB8"/>
    <text x="758" y="682" font-size="10.5" letter-spacing="4" fill="#1D7FC0" font-weight="700">基石二</text>
    <text x="758" y="708" font-size="17" font-weight="700" fill="#0E2B4D">信任力 2.0</text>
    <text x="758" y="732" font-size="12" fill="#4A6480">加粉转闭环 · 直购洗掉壳公司 · 新锐走向强信任　|　<tspan fill="#1D6FB8" font-weight="700">谁先完成，谁拿到长期入场券</tspan></text>

    <!-- 箭头 · 三个诊断 → 双基石 -->
    <line x1="268" y1="766" x2="268" y2="755" stroke="#6E9BC4" stroke-opacity="0.8" stroke-width="1.5" stroke-linecap="round"/>
    <use href="#chev" x="268" y="748"/>
    <line x1="720" y1="766" x2="720" y2="755" stroke="#6E9BC4" stroke-opacity="0.8" stroke-width="1.5" stroke-linecap="round"/>
    <use href="#chev" x="720" y="748"/>
    <line x1="1172" y1="766" x2="1172" y2="755" stroke="#6E9BC4" stroke-opacity="0.8" stroke-width="1.5" stroke-linecap="round"/>
    <use href="#chev" x="1172" y="748"/>

    <!-- ══════════ 三个诊断 ══════════ -->
    <rect x="56" y="770" width="424" height="118" rx="18" fill="#FFFFFF" stroke="#DCE4EE"/>
    <rect x="56" y="794" width="4" height="70" rx="2" fill="#1D6FB8"/>
    <circle cx="84" cy="796" r="3.4" fill="#1D7FC0"/>
    <text x="98" y="800" font-size="13.5" font-weight="700" fill="#0E2B4D">诊断一　结构在变好</text>
    <text x="80" y="832" font-size="14" fill="#4A5C6E">闭环占比 <tspan font-weight="700" fill="#12304F">30% <tspan fill="#1D7FC0">→ 46%</tspan></tspan>　33 万 → <tspan font-weight="700" fill="#12304F">89 万</tspan></text>
    <text x="80" y="856" font-size="11.5" fill="#7C8B9C">增量 <tspan fill="#1D7FC0" font-weight="700">+56 万/日</tspan>　小店同比 +222%，直播贡献增量 52%</text>
    <text x="80" y="876" font-size="11.5" fill="#93A1B0">闭环已成主战场　→　客群必须分层经营</text>

    <rect x="508" y="770" width="424" height="118" rx="18" fill="#FFFFFF" stroke="#DCE4EE"/>
    <rect x="508" y="794" width="4" height="70" rx="2" fill="#1D6FB8"/>
    <circle cx="536" cy="796" r="3.4" fill="#8A98A6"/>
    <text x="550" y="800" font-size="13.5" font-weight="700" fill="#0E2B4D">诊断二　打法有短板</text>
    <text x="532" y="832" font-size="14" fill="#4A5C6E">品类<tspan font-weight="700" fill="#12304F">点状拓客</tspan>　哪个火跟哪个，缺系统判断</text>
    <text x="532" y="856" font-size="11.5" fill="#7C8B9C">腾讯适合什么、比抖音差在哪，此前没有依据可循</text>
    <text x="532" y="876" font-size="11.5" fill="#93A1B0">经验判断不可复制　→　品类选择要有国标做依据</text>

    <rect x="960" y="770" width="424" height="118" rx="18" fill="#FDF7EE" stroke="#E5C79B"/>
    <rect x="960" y="794" width="4" height="70" rx="2" fill="#C8873A"/>
    <circle cx="988" cy="796" r="3.4" fill="#C8873A"/>
    <text x="1002" y="800" font-size="13.5" font-weight="700" fill="#8A5A18">诊断三　风险搬了家</text>
    <text x="984" y="832" font-size="14" fill="#5E4A32">加粉 42% → 21%　直购＋CID <tspan font-weight="700" fill="#3E2E1C">70 万</tspan>中仅 <tspan font-weight="700" fill="#B4761F">12 万</tspan>合规</text>
    <text x="984" y="856" font-size="11.5" fill="#7E6A50">约 58 万是 OG 切换伪装 —— <tspan fill="#B4761F" font-weight="700">加粉换壳，猫鼠游戏升级</tspan></text>
    <text x="984" y="876" font-size="11.5" fill="#9A8869">堵不住只能升维　→　靠信任力与闭环能力筛掉壳公司</text>
  </svg>

  <div class="legend">
    <span><i style="background:linear-gradient(90deg,#2A6BAE,#123762)"></i>屋顶 · 要交付的结果</span>
    <span><i style="background:#E7EEF7;border:1px solid #DCE4EE"></i>支柱 · H2 投入方向</span>
    <span><i style="background:linear-gradient(90deg,#EAF2FB,#E0EAF6);border:1px solid #B4CFEA"></i>基石 · 共同前提</span>
    <span><i style="background:#1D7FC0"></i>增量 / 向好</span>
    <span><i style="background:#C8873A"></i>风险项</span>
    <span><i style="background:#6E9BC4"></i>箭头 · 推导方向</span>
  </div>

  <div class="foot">
